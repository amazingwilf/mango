monitor_rule = name:eDP-1, width:920, height:1200, refresh:60, scale:2.00

env = XDG_CURRENT_DESKTOP, mango
env = XDG_SESSION_TYPE, wayland

# exec_once = swaybg -i /usr/share/backgrounds/eleven-dark.jpg -m zoom
# exec_once = waybar
exec_once = dms run

# Window effect
blur                   = 1
blur_layer             = 0
blur_optimized         = 1
blur_params_num_passes = 2
blur_params_radius     = 5
blur_params_noise      = 0.02
blur_params_brightness = 0.9
blur_params_contrast   = 0.9
blur_params_saturation = 1.2

shadows              = 0
layer_shadows        = 0
shadow_only_floating = 1
shadows_size         = 10
shadows_blur         = 15
shadows_position_x   = 0
shadows_position_y   = 0
shadows_color        = 0x000000ff

border_radius         = 10
no_radius_when_single = 1
focused_opacity       = 1.0
unfocused_opacity     = 1.0

dim_enable          = 0
dim_focused_color   = 0x00000000
dim_unfocused_color = 0x00000055

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations                       = 1
layer_animations                 = 1
animation_type_open              = slide
animation_type_close             = slide
animation_fade_in                = 1
animation_fade_out               = 1
tag_animation_direction          = 1
zoom_initial_ratio               = 0.4
zoom_end_ratio                   = 0.8
fade_in_begin_opacity            = 0.5
fade_out_begin_opacity           = 0.8
animation_duration_move          = 500
animation_duration_open          = 400
animation_duration_tag           = 350
animation_duration_close         = 800
animation_duration_focus         = 0
animation_curve_open             = 0.46,1.0,0.29,1
animation_curve_move             = 0.46,1.0,0.29,1
animation_curve_tag              = 0.46,1.0,0.29,1
animation_curve_close            = 0.08,0.92,0,1
animation_curve_focus            = 0.46,1.0,0.29,1
animation_curve_opacity_fade_out = 0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in  = 0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs                   = 20
scroller_default_proportion        = 0.8
scroller_focus_center              = 0
scroller_prefer_center             = 0
edge_scroller_pointer_focus        = 1
edge_scroller_focus_allow_speed    = 0.0
scroller_default_proportion_single = 1.0
scroller_proportion_preset         = 0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master         = 0
default_master_factor = 0.50
default_master_count  = 1
tag_num               = 6
smart_gaps            = 1

# Dwindle Layout Setting
dwindle_smart_split       = 0
dwindle_drop_simple_split = 1
dwindle_manual_split      = 0
dwindle_horizontal_split  = 1
dwindle_vertical_split    = 1
dwindle_preserve_split    = 0

# Monocle Layout Setting
monocle_tab_mode  = 1
monocle_no_border = 1
monocle_no_gap    = 1
monocle_no_radius = 1

# Deck Layout Setting
deck_tab_mode = 1

# Overview Setting
hotarea_size                      = 10
enable_hotarea                    = 0
hotarea_disable_on_fullscreen     = 1
overview_gap_inner                = 5
overview_gap_outer                = 30
overcircle_center_ratio           = 0.5
title_message_bar_height          = 52
title_message_bar_gap             = 20
workspace_overview_border_width             = 2
workspace_overview_gap                      = 5
workspace_overview_drag_threshold           = 5
workspace_overview_scroll_direction         = vertical
workspace_overview_scroll_ratio             = 0.8
workspace_overview_drag_scroll_speed        = 1.5
workspace_overview_focused_dim_opacity      = 0.0
workspace_overview_unfocused_dim_opacity    = 0.2
animation_duration_workspace_overview_open  = 260
animation_duration_workspace_overview_close = 260
animation_duration_workspace_overview_move  = 382
animation_curve_workspace_overview_open     = 0.333333,1.0,0.666667,1.0
animation_curve_workspace_overview_close    = 0.333333,1.0,0.666667,1.0
animation_curve_workspace_overview_move     = 0.26,0.99,0.26,1.0

# Misc
no_border_when_single             = 1
axis_bind_apply_timeout           = 100
focus_on_activate                 = 1
idle_inhibit_ignore_visible       = 0
idle_inhibit_when_fullscreen      = 0
sloppy_focus                      = 1
warp_cursor                       = 1
focus_cross_monitor               = 0
focus_direction_only_zone_overlap = 1
focus_cross_tag                   = 0
enable_floating_snap              = 0
snap_distance                     = 30
float_full_to_top                 = 0
cursor_theme                      = Qogirr-Dark
cursor_size                       = 24
drag_tile_to_tile                 = 1
drag_tile_small                   = 1

# keyboard
repeat_rate      = 25
repeat_delay     = 600
numlock_on       = 0
xkb_rules_layout = gb

# Trackpad
# need relogin to make it apply
disable_trackpad                 = 0
tap_to_click                     = 1
tap_and_drag                     = 1
drag_lock                        = 1
trackpad_natural_scrolling       = 0
trackpad_disable_while_typing    = 1
trackpad_left_handed             = 0
trackpad_middle_button_emulation = 0
swipe_min_threshold              = 1

# mouse
# need relogin to make it apply
mouse_natural_scrolling = 1

# Appearance
gap_inner_horizontal = 5
gap_inner_vertical   = 5
gap_outer_horizontal = 10
gap_outer_vertical   = 10

scratchpad_width_ratio  = 0.8
scratchpad_height_ratio = 0.9

border_px = 2

root_color             = 0x201b14ff
border_color           = 0x50545Bff
floating_color         = 0xc567ddff
drop_color             = 0x8FBA7C55
split_color            = 0xEB441EFF
focus_color            = 0x61afefff
maximized_screen_color = 0x55B6C2ff
urgent_color           = 0xad401fff
scratchpad_color       = 0x98C379ff
global_color           = 0xE5C07Aff
overlay_color          = 0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule = id:1, layout_name:tile
tag_rule = id:2, layout_name:tile
tag_rule = id:3, layout_name:tile
tag_rule = id:4, layout_name:tile
tag_rule = id:5, layout_name:tile
tag_rule = id:6, layout_name:tile

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none


# menu and terminal
bind = Super, Return, spawn, alacritty
bind = Super, W,      spawn, firefox

# exit
bind = Super,       Q, killclient,
bind = Super+Shift, Q, quit
bind = Super+Shift, R, reload_config

bindr = Super, Super_L, spawn, dms ipc call spotlight-bar toggle
bind  = Super, space,   spawn, dms ipc call spotlight toggle
bind  = Super, X,       spawn, dms ipc call powermenu toggle

bind = Super,       B,      spawn, dms ipc call bar toggle index 0
bind = Super+Shift, A,      spawn, dms ipc call control-center toggle
bind = Super+Shift, L,      spawn, dms ipc call lock lock
bind = Super+Shift, M,      spawn, dms ipc call dash toggle media
bind = Super,       P,      spawn, dms screenshot
bind = Super+Shift, P,      spawn, dms screenshot full
bind = Super+Ctrl,  P,      spawn, dms screenshot window
bind = Super+Shift, X,      spawn, dms ipc call powermenu toggle
bind = Super+Shift, Y,      spawn, dms ipc call dash toggle wallpaper
bind = Super,       comma,  spawn, dms ipc call settings focusOrToggle
bind = Ctrl+Alt,    Delete, spawn, dms ipc call processlist focusOrToggle

bindl  = none, XF86AudioRaiseVolume,  spawn, dms ipc call audio increment 3
bindl  = none, XF86AudioLowerVolume,  spawn, dms ipc call audio decrement 3
bindl  = none, XF86AudioMute,         spawn, dms ipc call audio mute
bindl  = none, XF86AudioMicMute,      spawn, dms ipc call audio micmute
bindl  = none, XF86AudioPlay,         spawn, dms ipc call mpris playPause
bindsl = none, XF86AudioPause,        spawn, dms ipc call mpris playPause
bindl  = none, XF86AudioPrev,         spawn, dms ipc call mpris previous
bindl  = none, XF86AudioNext,         spawn, dms ipc call mpris next
bindl  = none, XF86MonBrightnessUp,   spawn, dms ipc call brightness increment 5 ""
bindl  = none, XF86MonBrightnessDown, spawn, dms ipc call brightness decrement 5 ""



# bindl  = none, XF86AudioRaiseVolume,  spawn, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1+ -l 1.0
# bindl  = none, XF86AudioLowerVolume,  spawn, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1-
# bindl  = none, XF86AudioMute,         spawn, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# bindl  = none, XF86AudioMicMute,      spawn, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# bindl  = none, XF86AudioPlay,         spawn, playerctl play-pause
# bindl  = none, XF86AudioPrev,         spawn, playerctl previous
# bindl  = none, XF86AudioNext,         spawn, playerctl next
# bindl  = none, XF86MonBrightnessUp,   spawn, brightnessctl --class=backlight set +5%
# bindl  = none, XF86MonBrightnessDown, spawn, brightnessctl --class=backlight set 5%-
#
# workspace overview
bind = Super,       Tab, toggleworkspaceoverview, all
bind = Super+Shift, Tab, overcircle, next

# switch window focus
bind = Super, J, focusstack, next
bind = Super, K, focusstack, prev

bind = Super+Shift, J, exchange_stack_client, next
bind = Super+Shift, K, exchange_stack_client, prev

bind = Super, I, incnmaster, +1
bind = Super, U, incnmaster, -1

bind = Super, H, setmfact, -0.05
bind = Super, L, setmfact, +0.05

bind = Super,       S,         toggleglobal,
bind = Super,       backslash, togglefloating,
bind = Super,       A,         togglemaximizescreen,
bind = Super,       F,         togglefullscreen,
bind = Super+Shift, F,         togglefakefullscreen,
bind = Super,       O,         toggleoverlay,

bind = Super, T, setlayout, tile
bind = Super, R, setlayout, right_tile
bind = Super, V, setlayout, vertical_tile
bind = Super, M, setlayout, monocle
bind = Super, G, setlayout, grid
bind = Super, C, setlayout, center_tile

# tag switch
bind = Super, Left,  viewtoleft, 0
bind = Super, Right, viewtoright, 0

bind = Super+Shift, Left,  tagtoleft,  0
bind = Super+Shift, Right, tagtoright, 0

bind = Super, 1, view, 1, 0
bind = Super, 2, view, 2, 0
bind = Super, 3, view, 3, 0
bind = Super, 4, view, 4, 0
bind = Super, 5, view, 5, 0
bind = Super, 6, view, 6, 0

bind = Super+Shift, 1, tag, 1, 0
bind = Super+Shift, 2, tag, 2, 0
bind = Super+Shift, 3, tag, 3, 0
bind = Super+Shift, 4, tag, 4, 0
bind = Super+Shift, 5, tag, 5, 0
bind = Super+Shift, 6, tag, 6, 0

bind = Super, bracketright, incgaps,  1
bind = Super, bracketleft,  incgaps, -1

bind = Super+Shift, G, togglegaps

# movewin

# resizewin

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind = Super, btn_left,   moveresize, curmove
mousebind = none,  btn_middle, togglemaximizescreen, 0
mousebind = Super, btn_right,  moveresize, curresize


# Axis Bindings
axisbind = Super, Up,   viewtoleft_have_client
axisbind = Super, Down, viewtoright_have_client

# Gesture Bindings
gesturebind =none, left,  3, focusdir, left
gesturebind =none, right, 3, focusdir, right
gesturebind =none, up,    3, focusdir, up
gesturebind =none, down,  3, focusdir, down
gesturebind =none, right, 4, viewprev_have_client
gesturebind =none, left,  4, viewnext_have_client
gesturebind =none, up,    4, enteroverview
gesturebind =none, down,  4, leaveoverview

# layer rule
layer_rule = animation_type_open:zoom,layer_name:rofi
layer_rule = animation_type_close:zoom,layer_name:rofi

window_rule = app_id:.*, width:0.7, height:0.7

window_rule = is_floating:1, app_id:nwg-look

window_rule = tags:2, app_id:firefox
window_rule = tags:6, is_fullscreen:1, app_id:Spotify

